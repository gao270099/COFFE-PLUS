name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. 自动整理 www 网页目录并初始化 Capacitor
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            HTML_FILE=$(find . -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$HTML_FILE" ]; then
              cp "$HTML_FILE" www/index.html
              echo "已自动将 $HTML_FILE 复制为 www/index.html"
            else
              echo "错误：仓库中未找到任何 .html 文件！"
              exit 1
            fi
          fi
          npm install
          npx cap init "智能咖啡烘焙" "com.coffee.roaster.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: 5. 用 Python 绘制高对比度咖啡豆图标并替换
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --break-system-packages pillow
          python3 - << 'EOF'
          import os, math
          from PIL import Image, ImageDraw

          S = 1024
          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle([0, 0, S, S], radius=220, fill=(107, 74, 47, 255))
          draw.ellipse([130, 130, S - 130, S - 130], outline=(212, 175, 95, 255), width=14)

          bean_layer = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          bdraw = ImageDraw.Draw(bean_layer)

          cx, cy = S // 2, S // 2
          rx, ry = 195, 275

          bdraw.ellipse([cx - rx + 12, cy - ry + 16, cx + rx + 12, cy + ry + 16], fill=(42, 24, 10, 140))
          bdraw.ellipse([cx - rx, cy - ry, cx + rx, cy + ry], fill=(255, 248, 231, 255), outline=(232, 204, 152, 255), width=8)

          pts = []
          steps = 60
          for i in range(steps + 1):
              u = i / steps
              y = (cy - ry + 26) + u * (2 * ry - 52)
              x = cx + math.sin(u * math.pi * 2) * 34
              pts.append((x, y))
          bdraw.line(pts, fill=(68, 38, 16, 255), width=28)

          rotated_bean = bean_layer.rotate(28, resample=Image.Resampling.BICUBIC, center=(cx, cy))
          img = Image.alpha_composite(img, rotated_bean)
          img.save("/tmp/bean_1024.png")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res_root = "android/app/src/main/res"
          for folder, px in sizes.items():
              out_dir = os.path.join(res_root, folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  resized.save(os.path.join(out_dir, fname))

          for xml_path in [
              os.path.join(res_root, "mipmap-anydpi-v26/ic_launcher.xml"),
              os.path.join(res_root, "mipmap-anydpi-v26/ic_launcher_round.xml"),
          ]:
              if os.path.exists(xml_path):
                  os.remove(xml_path)

          print("咖啡豆图标生成完成！")
          EOF

      - name: 6. 配置 Gradle 镜像源并锁定横屏方向
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirrors.gradle
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven.aliyun.com/repository/public' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                google()
                mavenCentral()
              }
            }
            repositories {
              maven { url 'https://maven.aliyun.com/repository/public' }
              maven { url 'https://maven.aliyun.com/repository/google' }
              google()
              mavenCentral()
            }
          }
          EOF
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="landscape"/g' android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: 7. 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 8. 上传 APK 产物供下载
        uses: actions/upload-artifact@v4
        with:
          name: SmartCoffeeRoaster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
